[package]
name = "calci"
version = "1.0.0"
edition = "2024"
description = "A TUI markdown rendered with math support"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
pulldown-cmark = "0.13.1"
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
resvg = "0.47.0"
serde = { version = "1.0.228", features = ["derive"] }
syntect = "5.3.0"
toml = "1.0.7"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
webbrowser = "1.2.0"
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-render = { version = "0.1.15", features = ["embed-fonts"] }
typst = "0.15.1"
typst-render = "0.15.1"
mitex = "0.2.4"
typst-layout = "0.15.1"

[dev-dependencies]
tempfile = "3.27.0"
